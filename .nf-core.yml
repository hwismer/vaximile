repository_type: pipeline
nf_core_version: 3.2.0
lint:
  # This pipeline predates the nf-core template and was reorganised into the
  # nf-core directory layout by hand. The exclusions below cover template files
  # that do not exist yet, and conventions the local modules do not follow.
  files_exist:
    # No LICENSE yet - pick one before making the repository public.
    - LICENSE
    - CODE_OF_CONDUCT.md
    - .github/CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/awsfulltest.yml
    - .github/workflows/awstest.yml
    - .github/workflows/branch.yml
    - assets/email_template.html
    - assets/email_template.txt
    - assets/multiqc_config.yml
    - assets/nf-core-vaximile_logo_light.png
    - assets/sendmail_template.txt
    - conf/igenomes.config
    - docs/images/nf-core-vaximile_logo_dark.png
    - docs/images/nf-core-vaximile_logo_light.png
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
  multiqc_config: false
  # Local modules still hardcode cpus/memory and tool arguments in the process body.
  modules_config: false
  template_strings: false
