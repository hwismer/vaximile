name: nf-test CI
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  # The pipeline requires a VEP cache and real tumour/normal FastQ pairs, so there is no
  # end-to-end test yet. This job only proves that every include path resolves and that the
  # DAG can be built - which is what the nf-core reorganisation most needs to guard.
  preview:
    name: Resolve DAG
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER: ["24.10.5", "latest-everything"]
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Inspect the workflow without running it
        run: |
          nextflow inspect . -profile test --outdir ./results
