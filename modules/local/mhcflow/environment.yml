name: mhcflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip=24.2
  - samtools=1.21
  - novoalign=4.03.04
  - pip:
      - mhcflow==0.2.3

# NOTE: novoalign is a runtime dependency of mhcflow, not a build-time one, and
# mhcflow does not check for it — see the notes below.
#
# ---------------------------------------------------------------------------
# Usage
# ---------------------------------------------------------------------------
#   Standalone:
#     conda env create -f environment.yml
#     conda activate mhcflow
#
#   Nextflow (file must end in .yml or .yaml or it won't be recognised):
#     conda "${moduleDir}/environment.yml"
#
# ---------------------------------------------------------------------------
# Why pip is listed twice
# ---------------------------------------------------------------------------
# `- pip=24.2` installs the pip binary into the environment. `- pip:` is the
# nested key handing packages to it. Omit the first and conda may fall back to
# a system pip that installs into the wrong prefix.
#
# mhcflow's own Python deps (mhctyper, tinyscibio, pyahocorasick, pyfaidx) are
# resolved by pip automatically — no need to list them unless you want to pin
# them, in which case add them under the pip: block with == pins.
#
# ---------------------------------------------------------------------------
# NOVOALIGN
# ---------------------------------------------------------------------------
# From mhcflow's install docs, verbatim:
#
#   "mhcflow implicitly requires samtools, novoalign, and novoindex binaries
#    to be available in your environment. Currently, mhcflow does not check
#    for the presence of these binaries."
#
# bioconda does package novoalign, which is why it is pinned above and why
# NOVOALIGN_HLA_FASTA pins the same version to build the .nix index. The package
# installs both `novoalign` and `novoindex`. 4.03.04 is the newest bioconda has.
#
# linux-64 only: bioconda stopped building osx after 3.09.00, so this env does
# not solve on a Mac, and it fails pointing at glibc rather than at novoalign.
#
# The licence is the caveat, not the availability: novoalign is commercial, and
# the unlicensed binary runs in free mode, which is single-threaded. mhcflow's
# realigner runs one novoalign process per fished read pair and passes no thread
# flag, so free mode works, but a licensed install is faster. To use a site
# licence instead of this conda copy, put it ahead on PATH in the process script
# and export the licence file:
#
#   export PATH=/path/to/novocraft:$PATH
#   export NOVOALIGN_LICENSE=/path/to/novoalign.lic
#
# Because mhcflow does not check for these binaries, a missing or broken
# novoalign surfaces as a confusing downstream error rather than a clean
# "command not found". Verify with:
#
#   which samtools novoalign novoindex
