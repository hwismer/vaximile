name: mhcflow
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip=24.2
  - samtools=1.21
  - pip:
      - mhcflow==0.2.3

# mhcflow also needs novoalign and novoindex on PATH, and does not check for them: a
# missing novoalign shows up as samtools failing to read a header and a missing
# realigned BAM. Bioconda removed novoalign in October 2026 at Novocraft's request, so
# the binaries come from --novoalign_dir, which the MHCFLOW and MHCFLOW_REALIGN scripts
# put on PATH. Novoalign V4 needs its novoalign.lic in that directory; V3 runs without one.
